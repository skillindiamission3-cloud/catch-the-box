<title>Catch the Box</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: linear-gradient(135deg, #050505, #151530);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
}

/* HEADER */

h1 {
    margin: 15px 0;
    font-size: 32px;
}

#info {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 10px;
    font-size: 18px;
}

/* GAME */

#game {
    width: min(500px, 95vw);
    height: 600px;
    margin: auto;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 20%, #252550, #101020 60%, #050509);

    border: 3px solid white;
    border-radius: 15px;

    box-shadow: 0 0 30px rgba(0,255,255,0.25);
}

/* STARS */

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
}

/* PLAYER */

#player {
    width: 85px;
    height: 25px;

    background: linear-gradient(90deg, #00ff88, #00ffff);

    position: absolute;
    bottom: 25px;
    left: calc(50% - 42px);

    border-radius: 15px;

    box-shadow: 0 0 15px #00ffff;
}

/* BOX */

#box {
    width: 35px;
    height: 35px;

    background: linear-gradient(135deg, #ff2222, #ff8800);

    position: absolute;
    top: -50px;
    left: 100px;

    border-radius: 8px;

    box-shadow: 0 0 15px red;
}

/* START SCREEN */

#startScreen,
#gameOverScreen {
    position: absolute;
    inset: 0;

    background: rgba(0,0,0,0.85);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 10;
}

#gameOverScreen {
    display: none;
}

#startScreen h2,
#gameOverScreen h2 {
    font-size: 40px;
    margin-bottom: 20px;
}

/* BUTTONS */

button {
    border: none;
    border-radius: 10px;

    padding: 12px 25px;

    margin: 8px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    background: linear-gradient(90deg, #00ffff, #00ff88);

    color: #001010;

    transition: 0.2s;
}

button:hover {
    transform: scale(1.08);
}

/* PAUSE */

#pauseButton {
    position: absolute;
    top: 10px;
    right: 10px;

    padding: 7px 12px;
    font-size: 14px;

    z-index: 5;
}

/* MOBILE CONTROLS */

#mobileControls {
    display: flex;
    justify-content: center;
    gap: 50px;

    margin-top: 15px;
}

.controlButton {
    width: 90px;
    height: 55px;

    font-size: 25px;

    background: #222;
    color: white;

    border: 2px solid #00ffff;
}

/* INSTRUCTIONS */

#instructions {
    margin: 15px auto;
    max-width: 500px;
    font-size: 14px;
    color: #bbb;
}

@media (min-width: 700px) {
    #mobileControls {
        display: none;
    }
}
</style>
